<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PT Bumi Rempah Sulawesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6EFE4;--bg2:#EADBC4;--card:#FFFBF4;--ink:#2B1810;--mute:#5C4638;--dark:#2B1810;--dark2:#1C0F0A;--acc:#8F3E1B;--acc2:#E8A27C;--on-dark:#F6EFE4;--on-dark2:#E9D9C3;--line:rgba(43,24,16,.18);color-scheme:light;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A0F0A;--bg2:#241610;--card:#2D1B13;--ink:#F3E8D8;--mute:#C9B79F;--acc:#E8A27C;--line:rgba(243,232,216,.2);--dark:#120A06;--dark2:#0C0604;color-scheme:dark}}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 'Inter',system-ui,sans-serif}
img{display:block;max-width:100%}
a{color:var(--acc)}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;line-height:1.12;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
section{padding:96px 0}
.alt{background:var(--bg2)}
.eyebrow{margin:0 0 12px;font-weight:600;color:var(--acc);font-size:15px}
h2{font-size:clamp(30px,5vw,44px)}
p{margin:0 0 16px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.split.rev>:first-child{order:2}
.ph{border-radius:16px;overflow:hidden;box-shadow:0 18px 40px -18px rgba(43,24,16,.55)}
.ph img{width:100%;height:100%;object-fit:cover}
.tall{aspect-ratio:4/5}.wide{aspect-ratio:4/3}
header{position:sticky;top:0;z-index:40;background:var(--dark);padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 24px;padding-top:14px;padding-bottom:14px}
.brand{display:inline-flex;align-items:center;gap:12px;font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:20px;color:var(--on-dark);text-decoration:none}
.brand img{width:48px;height:48px;border-radius:50%;box-shadow:0 0 0 2px var(--acc2)}
nav{display:flex;flex-wrap:wrap;gap:4px 24px;font-size:15px}
nav a{color:var(--on-dark2);text-decoration:none;padding:8px 0;border-bottom:2px solid transparent}
nav a:hover,nav a:focus-visible{color:#fff;border-bottom-color:var(--acc2)}
:focus-visible{outline:3px solid var(--acc2);outline-offset:3px}
.hero{background:var(--dark);color:var(--on-dark);padding:72px 0 96px;overflow:hidden}
.hero .split{gap:48px}
.hero h1{font-size:clamp(38px,6vw,66px);margin-bottom:22px}
.hero p.lead{font-size:20px;color:var(--on-dark2);max-width:560px}
.kicker{color:var(--acc2);font-weight:600;font-size:15px;margin-bottom:16px}
.btns{display:flex;flex-wrap:wrap;gap:14px;margin-top:28px}
.btn{display:inline-block;padding:14px 28px;border-radius:8px;font-weight:600;text-decoration:none;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-2px)}
.btn.p{background:var(--acc2);color:#2B1810}
.btn.o{border:1.5px solid var(--acc2);color:var(--on-dark)}
.hero-ph{position:relative}
.hero-ph .main{aspect-ratio:4/5;border-radius:200px 200px 16px 16px;overflow:hidden;border:6px solid var(--acc2)}
.hero-ph .main img{width:100%;height:100%;object-fit:cover}
.hero-ph .chip{position:absolute;left:-18px;bottom:28px;width:44%;aspect-ratio:1;border-radius:14px;overflow:hidden;border:5px solid var(--dark);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.hero-ph .chip img{width:100%;height:100%;object-fit:cover}
.mis{display:flex;flex-direction:column;gap:18px;margin-top:8px}
.mis div{display:flex;gap:16px;align-items:flex-start;border-top:1px solid var(--line);padding-top:16px}
.mis b{font-family:'Fraunces',Georgia,serif;font-size:28px;color:var(--acc);min-width:30px;line-height:1.1}
.mis p{margin:0}
.vis{background:var(--dark);color:var(--on-dark);padding:40px;border-radius:16px}
.vis h3{font-size:30px;color:var(--acc2);margin-bottom:14px}
.vis p{font-size:21px;margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;margin-top:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:30px}
.card h3{font-size:24px;margin-bottom:10px}
.card p{margin:0;color:var(--mute)}
.prods{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:32px;margin-top:40px}
.prod{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.prod .pic{aspect-ratio:16/10;overflow:hidden}
.prod .pic img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.prod:hover .pic img{transform:scale(1.04)}
.prod .txt{padding:30px 32px 34px}
.prod h3{font-size:30px;margin-bottom:14px}
.prod p{margin:0 0 10px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.tags span{background:var(--bg2);border-radius:999px;padding:4px 14px;font-size:14px}
.gal{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:210px;gap:14px;margin-top:40px}
.gal button{padding:0;border:0;border-radius:12px;overflow:hidden;cursor:zoom-in;position:relative;background:var(--bg2)}
.gal button:nth-child(1),.gal button:nth-child(6){grid-column:span 2;grid-row:span 2}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.gal button:hover img{transform:scale(1.06)}
.gal span{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 10px;text-align:left;color:#fff;font-size:14px;background:linear-gradient(transparent,rgba(0,0,0,.7))}
dialog{border:0;padding:0;background:transparent;max-width:min(94vw,900px);max-height:92vh;color:#fff}
dialog::backdrop{background:rgba(10,5,3,.85)}
dialog img{max-height:84vh;margin:0 auto;border-radius:10px}
dialog p{text-align:center;margin:10px 0 0}
dialog button{position:absolute;top:8px;right:8px;background:#fff;
